[package]
name = "herdr-workbench"
version = "1.0.9"
edition = "2024"
rust-version = "1.97.1"
description = "A polished project sidebar for Herdr with Explorer, live file and content search, read-only Source Control, rich previews, file icons, and Git decorations."
license = "MIT"
publish = false

[dependencies]
base64 = { version = "0.23.0", default-features = false, features = ["alloc"] }
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events"] }
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
libc = "0.2.189"
notify = "8.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shlex = "2.0.1"
toml = "1.1.3"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
